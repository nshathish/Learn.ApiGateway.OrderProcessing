name: Deploy Microservices to ACA

on:
    push:
        branches:
            - main
        paths:
            - "CartService/**"
            - "ProductService/**"
            - "UserService/**"
            - "PaymentService/**"
            - "ApiGateway/**"
            - ".github/workflows/aca-services-deploy.yml"
    workflow_run:
        workflows:
            - Deploy Infra (Terraform)
        types:
            - completed
        branches:
            - main
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy"
                required: true
                default: "development"

permissions:
    id-token: write
    contents: read

env:
    RESOURCE_GROUP_NAME: azlabs13600-dev-rg

jobs:
    approve:
        name: Await Manual Approval
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        environment:
            name: aca-approval
        steps:
            - name: Approved
              run: echo "Deployment approved — proceeding with ACA services deployment"

    deploy:
        name: Build, Push and Deploy Services
        needs: approve
        runs-on: ubuntu-latest

        environment:
            name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Resolve ACR details
              shell: bash
              run: |
                  set -euo pipefail

                  ACR_NAME=$(az acr list -g "$RESOURCE_GROUP_NAME" --query "[0].name" -o tsv)
                  if [ -z "$ACR_NAME" ]; then
                    echo "No ACR found in resource group $RESOURCE_GROUP_NAME"
                    exit 1
                  fi

                  ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP_NAME" --query "loginServer" -o tsv)

                  echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
                  echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

            - name: Build and push images to ACR
              shell: bash
              run: |
                  set -euo pipefail

                  IMAGE_TAG=${GITHUB_SHA::7}
                  echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

                  # az acr build sends the build context to ACR Tasks — no local Docker daemon needed
                  az acr build --registry "$ACR_NAME" --image "cartservice:$IMAGE_TAG"    --file CartService/Dockerfile    .
                  az acr build --registry "$ACR_NAME" --image "productservice:$IMAGE_TAG" --file ProductService/Dockerfile .
                  az acr build --registry "$ACR_NAME" --image "userservice:$IMAGE_TAG"    --file UserService/Dockerfile    .
                  az acr build --registry "$ACR_NAME" --image "paymentservice:$IMAGE_TAG" --file PaymentService/Dockerfile .
                  az acr build --registry "$ACR_NAME" --image "apigateway:$IMAGE_TAG"     --file ApiGateway/Dockerfile     .

            - name: Update Container Apps
              shell: bash
              run: |
                  set -euo pipefail

                  retry_update() {
                    local app_name="$1"
                    local image="$2"
                    local attempt=1
                    local max_attempts=20
                    local wait_seconds=15
                    local output=""

                    while [ "$attempt" -le "$max_attempts" ]; do
                      output=$(az containerapp update \
                        --name "$app_name" \
                        --resource-group "$RESOURCE_GROUP_NAME" \
                        --image "$image" 2>&1) && return 0

                      if echo "$output" | grep -qi "ContainerAppOperationInProgress"; then
                        echo "$app_name: waiting for active ACA operation (attempt $attempt/$max_attempts)..."
                        sleep "$wait_seconds"
                        attempt=$((attempt + 1))
                        continue
                      fi

                      echo "$output"
                      return 1
                    done

                    echo "$app_name: update failed after $max_attempts attempts"
                    echo "$output"
                    return 1
                  }

                  retry_update "cartservice-app"    "$ACR_LOGIN_SERVER/cartservice:$IMAGE_TAG"
                  retry_update "productservice-app" "$ACR_LOGIN_SERVER/productservice:$IMAGE_TAG"
                  retry_update "userservice-app"    "$ACR_LOGIN_SERVER/userservice:$IMAGE_TAG"
                  retry_update "paymentservice-app" "$ACR_LOGIN_SERVER/paymentservice:$IMAGE_TAG"
                  retry_update "apigateway-app"     "$ACR_LOGIN_SERVER/apigateway:$IMAGE_TAG"

            - name: Deployment summary
              shell: bash
              run: |
                  echo "Deployed image tag: $IMAGE_TAG"
                  echo "Resource group:     $RESOURCE_GROUP_NAME"
                  echo "ACR login server:   $ACR_LOGIN_SERVER"
